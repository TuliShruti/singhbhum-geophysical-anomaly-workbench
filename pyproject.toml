[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singhbhum-prospectivity-workbench"
version = "0.1.0"
description = "Reproducible geophysical anomaly analysis for mineral prospectivity research."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.31", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["src*", "app*"]
